<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal ALM - Gestão de Testes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<style>

body{
    background:#f4f6f9;
}

.card-kpi{
    border-left:5px solid #0d6efd;
}

.table td,
.table th{
    vertical-align:middle;
}

select{
    min-width:140px;
}

.btn-delete{
    width:40px;
}

.chart-box{
    position:relative;
    height:260px;
}

</style>

</head>

<body>

<div class="container-fluid p-4">

    <h2 class="mb-4">
        Portal ALM - Gestão de Testes
    </h2>

    <!-- KPIs -->

    <div class="row g-3 mb-4">

        <div class="col">
            <div class="card card-kpi">
                <div class="card-body">
                    <h6>Total CSP</h6>
                    <h3 id="total">0</h3>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card card-kpi">
                <div class="card-body">
                    <h6>Em Andamento</h6>
                    <h3 id="andamento">0</h3>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card card-kpi">
                <div class="card-body">
                    <h6>Finalizados</h6>
                    <h3 id="finalizado">0</h3>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card card-kpi">
                <div class="card-body">
                    <h6>Interrompidos</h6>
                    <h3 id="interrompido">0</h3>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="card card-kpi">
                <div class="card-body">
                    <h6>% Conclusão</h6>
                    <h3 id="conclusao">0%</h3>
                </div>
            </div>
        </div>

    </div>

    <!-- Cadastro -->

    <div class="card mb-4">

        <div class="card-header">
            Novo CSP
        </div>

        <div class="card-body">

            <div class="row md-2">

                <div class="col-md-1">

                    <input
                        id="csp"
                        class="form-control"
                        placeholder="Digite ou cole um ou mais CSPs">

                </div>

                <div class="col-md-2">

                    <button
                        class="btn btn-primary w-10"
                        onclick="addTask()">

                        Adicionar

                    </button>

                </div>

                <div class="col-md-2"></div>

            </div>

        </div>

    </div>

    <!-- Tabela -->

    <div class="table-responsive">

        <table class="table table-bordered table-hover bg-white">

            <thead class="table-light">

            <tr>

                <th>CSP</th>
                <th>Data Inicial</th>
                <th>Criação Plano de Teste</th>
                <th>Execução Plano de Teste</th>
                <th>Motivo</th>
                <th>Status Geral</th>
                <th width="80">Excluir</th>

            </tr>

            </thead>

            <tbody id="tbody"></tbody>

        </table>

    </div>

    <!-- Dashboard -->

    <div class="row g-3 mt-2">

        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header">Status Geral</div>
                <div class="card-body">
                    <div class="chart-box">
                        <canvas id="chartStatus"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header">Criação x Execução do Plano de Teste</div>
                <div class="card-body">
                    <div class="chart-box">
                        <canvas id="chartEtapas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header">CSPs cadastrados por dia</div>
                <div class="card-body">
                    <div class="chart-box">
                        <canvas id="chartDias"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Exportar -->

    <div class="d-flex justify-content-end align-items-center gap-2 mt-4">

        <span class="text-muted me-1">Exportar:</span>

        <button class="btn btn-outline-success btn-sm" onclick="exportarExcel()">Excel</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="exportarCSV()">CSV</button>
        <button class="btn btn-outline-danger btn-sm" onclick="exportarPDF()">PDF</button>

    </div>

</div>

<script>

let dados = JSON.parse(
    localStorage.getItem('almDados') || '[]'
);

const COR = {
    pendente:'#ffc107',
    realizado:'#198754',
    interrompido:'#dc3545'
};

let charts = {};

function statusGeral(criacao,execucao){

    if(
        criacao === 'Interrompido' ||
        execucao === 'Interrompido'
    ){
        return 'Interrompido';
    }

    if(
        criacao === 'Realizado' &&
        execucao === 'Realizado'
    ){
        return 'Finalizado';
    }

    return 'Em Andamento';

}

function badge(status){

    if(status === 'Interrompido'){

        return `
        <span class="badge bg-danger">
            INTERROMPIDO
        </span>`;
    }

    if(status === 'Finalizado'){

        return `
        <span class="badge bg-success">
            FINALIZADO
        </span>`;
    }

    return `
    <span class="badge bg-warning text-dark">
        EM ANDAMENTO
    </span>`;

}

function salvar(){

    localStorage.setItem(
        'almDados',
        JSON.stringify(dados)
    );

}

/* ---------- Dashboard ---------- */

function chaveData(str){

    // "18/11/2026, 14:30:00" -> "2026-11-18" (ordenável)
    const p = (str || '').split(',')[0].trim().split('/');

    if(p.length !== 3){
        return '';
    }

    return p[2] + '-' + p[1] + '-' + p[0];

}

function formatarChave(k){

    const p = k.split('-');

    return p[2] + '/' + p[1];

}

function upsertChart(id,config){

    if(typeof Chart === 'undefined'){
        return;
    }

    if(charts[id]){

        charts[id].data = config.data;
        charts[id].update();

        return;

    }

    charts[id] = new Chart(
        document.getElementById(id),
        config
    );

}

function renderCharts(andamento,finalizado,interrompido){

    // 1) Status geral (rosca)

    upsertChart('chartStatus',{

        type:'doughnut',

        data:{
            labels:['Em Andamento','Finalizado','Interrompido'],
            datasets:[{
                data:[andamento,finalizado,interrompido],
                backgroundColor:[
                    COR.pendente,
                    COR.realizado,
                    COR.interrompido
                ]
            }]
        },

        options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{legend:{position:'bottom'}}
        }

    });

    // 2) Criação x Execução (barras empilhadas)

    const etapas = ['criacao','execucao'];

    const conta = (campo,valor) =>
        dados.filter(d => d[campo] === valor).length;

    upsertChart('chartEtapas',{

        type:'bar',

        data:{
            labels:['Criação','Execução'],
            datasets:[
                {
                    label:'Pendente',
                    backgroundColor:COR.pendente,
                    data:etapas.map(e => conta(e,'Pendente'))
                },
                {
                    label:'Realizado',
                    backgroundColor:COR.realizado,
                    data:etapas.map(e => conta(e,'Realizado'))
                },
                {
                    label:'Interrompido',
                    backgroundColor:COR.interrompido,
                    data:etapas.map(e => conta(e,'Interrompido'))
                }
            ]
        },

        options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{legend:{position:'bottom'}},
            scales:{
                x:{stacked:true},
                y:{stacked:true,beginAtZero:true,ticks:{precision:0}}
            }
        }

    });

    // 3) CSPs cadastrados por dia

    const porDia = {};

    dados.forEach(d=>{

        const k = chaveData(d.data);

        if(k){
            porDia[k] = (porDia[k] || 0) + 1;
        }

    });

    const chaves = Object.keys(porDia).sort();

    upsertChart('chartDias',{

        type:'bar',

        data:{
            labels:chaves.map(formatarChave),
            datasets:[{
                label:'CSPs',
                backgroundColor:'#0d6efd',
                data:chaves.map(k => porDia[k])
            }]
        },

        options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{legend:{display:false}},
            scales:{
                y:{beginAtZero:true,ticks:{precision:0}}
            }
        }

    });

}

/* ---------- Tabela ---------- */

function render(){

    let tbody =
        document.getElementById('tbody');

    tbody.innerHTML = '';

    let andamento = 0;
    let finalizado = 0;
    let interrompido = 0;

    dados.forEach((item,index)=>{

        let status =
            statusGeral(
                item.criacao,
                item.execucao
            );

        if(status === 'Em Andamento'){
            andamento++;
        }

        if(status === 'Finalizado'){
            finalizado++;
        }

        if(status === 'Interrompido'){
            interrompido++;
        }

        tbody.innerHTML += `

        <tr>

            <td>${item.csp}</td>

            <td>${item.data}</td>

            <td>

                <select
                    class="form-select"
                    onchange="atualizar(${index},'criacao',this.value)">

                    <option ${item.criacao==='Pendente'?'selected':''}>
                        Pendente
                    </option>

                    <option ${item.criacao==='Realizado'?'selected':''}>
                        Realizado
                    </option>

                    <option ${item.criacao==='Interrompido'?'selected':''}>
                        Interrompido
                    </option>

                </select>

            </td>

            <td>

                <select
                    class="form-select"
                    onchange="atualizar(${index},'execucao',this.value)">

                    <option ${item.execucao==='Pendente'?'selected':''}>
                        Pendente
                    </option>

                    <option ${item.execucao==='Realizado'?'selected':''}>
                        Realizado
                    </option>

                    <option ${item.execucao==='Interrompido'?'selected':''}>
                        Interrompido
                    </option>

                </select>

            </td>

            <td>

                <input
                    class="form-control"
                    value="${item.motivo || ''}"
                    onchange="alterarMotivo(${index},this.value)">

            </td>

            <td>

                ${badge(status)}

            </td>

            <td class="text-center">

                <button
                    class="btn btn-danger btn-sm btn-delete"
                    onclick="excluir(${index})"
                    title="Excluir CSP">

                    🗑️

                </button>

            </td>

        </tr>

        `;

    });

    document.getElementById('total').innerText =
        dados.length;

    document.getElementById('andamento').innerText =
        andamento;

    document.getElementById('finalizado').innerText =
        finalizado;

    document.getElementById('interrompido').innerText =
        interrompido;

    document.getElementById('conclusao').innerText =
        (dados.length
            ? Math.round(finalizado / dados.length * 100)
            : 0) + '%';

    renderCharts(andamento,finalizado,interrompido);

    salvar();

}

function addTask(){

    const texto =
        document.getElementById('csp')
        .value
        .trim();

    if(!texto){

        alert('Informe pelo menos um CSP.');

        return;
    }

    const csps = texto
        .split(/[\n,;\t ]+/)
        .filter(x => x.trim() !== '');

    let duplicados = [];

    csps.forEach(csp=>{

        csp = csp.trim();

        const existe =
            dados.some(
                item =>
                item.csp.toUpperCase() ===
                csp.toUpperCase()
            );

        if(existe){

            duplicados.push(csp);

            return;

        }

        dados.push({

            csp:csp,

            data:new Date()
            .toLocaleString('pt-BR'),

            criacao:'Pendente',

            execucao:'Pendente',

            motivo:''

        });

    });

    if(duplicados.length > 0){

        alert(
            'Os seguintes CSPs já estão cadastrados:\n\n' +
            duplicados.join('\n')
        );

    }

    document.getElementById('csp').value='';

    render();

}

function atualizar(index,campo,valor){

    dados[index][campo] = valor;

    if(
        valor === 'Interrompido' &&
        !dados[index].motivo
    ){

        alert(
            'Informe o motivo da interrupção.'
        );

    }

    render();

}

function alterarMotivo(index,valor){

    dados[index].motivo = valor;

    render();

}

function excluir(index){

    if(
        confirm(
            'Deseja realmente excluir este CSP?'
        )
    ){

        dados.splice(index,1);

        render();

    }

}

/* ---------- Exportação ---------- */

const CABECALHO = [
    'CSP','Data Inicial','Criação Plano de Teste',
    'Execução Plano de Teste','Motivo','Status Geral'
];

function linhasExport(){

    return dados.map(d => [
        d.csp,
        d.data,
        d.criacao,
        d.execucao,
        d.motivo || '',
        statusGeral(d.criacao,d.execucao)
    ]);

}

function nomeArquivo(ext){

    const h = new Date();
    const pad = n => String(n).padStart(2,'0');

    return 'ALM_CSPs_' +
        h.getFullYear() + pad(h.getMonth()+1) + pad(h.getDate()) +
        '.' + ext;

}

function semDados(){

    if(dados.length === 0){

        alert('Não há dados para exportar.');

        return true;

    }

    return false;

}

function exportarExcel(){

    if(semDados()) return;

    if(typeof XLSX === 'undefined'){
        alert('Biblioteca de Excel não carregada. Verifique a internet.');
        return;
    }

    const ws = XLSX.utils.aoa_to_sheet(
        [CABECALHO].concat(linhasExport())
    );

    ws['!cols'] = [
        {wch:18},{wch:20},{wch:24},{wch:24},{wch:40},{wch:16}
    ];

    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb,ws,'CSPs');

    XLSX.writeFile(wb,nomeArquivo('xlsx'));

}

function exportarCSV(){

    if(semDados()) return;

    const esc = v =>
        '"' + String(v).replace(/"/g,'""') + '"';

    const csv = [CABECALHO]
        .concat(linhasExport())
        .map(l => l.map(esc).join(';'))
        .join('\r\n');

    // BOM + ";" para o Excel em português abrir com acentos e colunas corretas
    const blob = new Blob(
        ['\uFEFF' + csv],
        {type:'text/csv;charset=utf-8;'}
    );

    const a = document.createElement('a');

    a.href = URL.createObjectURL(blob);
    a.download = nomeArquivo('csv');

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(a.href);

}

function exportarPDF(){

    if(semDados()) return;

    if(!window.jspdf){
        alert('Biblioteca de PDF não carregada. Verifique a internet.');
        return;
    }

    const doc = new window.jspdf.jsPDF({orientation:'landscape'});

    doc.setFontSize(14);
    doc.text('Portal ALM - Gestão de Testes',14,14);

    doc.setFontSize(9);
    doc.text(
        'Gerado em ' + new Date().toLocaleString('pt-BR') +
        '  |  Total: ' + dados.length,
        14,20
    );

    doc.autoTable({
        head:[CABECALHO],
        body:linhasExport(),
        startY:25,
        styles:{fontSize:8},
        headStyles:{fillColor:[13,110,253]}
    });

    doc.save(nomeArquivo('pdf'));

}

document.getElementById('csp')
.addEventListener('keydown',function(e){

    if(e.key === 'Enter'){

        e.preventDefault();

        addTask();

    }

});

render();

</script>

</body>
</html>
